org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

flutter.compileSdkVersion=37
flutter.targetSdkVersion=36
flutter.minSdkVersion=24
# AGP 8.13's compileSdk AAR-metadata gate rejects flutter_blue_plus 1.32.8
# (pinned: 2.x moved connect() to a paid-license) because that plugin module
# compiles against android-33 while its androidx transitives demand API 34+.
# The app itself compiles against 37, so the merged artifact satisfies them -
# only the plugin's stale compileSdk trips the gate.
android.experimental.disableCompileSdkChecks=true
