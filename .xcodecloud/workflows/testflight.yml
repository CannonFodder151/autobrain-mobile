# Xcode Cloud workflow: TestFlight beta build.
# AUT-463: archive + upload to App Store Connect (internal TestFlight testing).
# Triggers on v* tags (see triggers below). Runner: com.autobrain.autobrain.
name: TestFlight

workflow:
  name: TestFlight
  description: Build and upload to TestFlight (internal testing) on v* tags.

  # Build environment
  environment:
    # Use a stable Xcode Cloud image with Flutter pre-installed.
    # Flutter is not pre-bundled on Xcode Cloud; install it in the post-checkout step.
    type: macos
    os: 15.0
    xcode: latest

  # Trigger: any v* tag pushed to the repo.
  triggers:
    - push:
        patterns:
          - "v*"

  actions:
    - post-checkout:
        name: Install Flutter SDK
        # Flutter is not pre-installed on Xcode Cloud runners. Install the
        # stable channel and cache it for the duration of the build.
        script: |
          set -euo pipefail
          git clone --depth 1 https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          export PATH="$FLUTTER_HOME/bin:$PATH"
          flutter --version
          flutter doctor

    - build:
        name: Flutter pub get
        script: |
          set -euo pipefail
          export PATH="$FLUTTER_HOME/bin:$PATH"
          flutter pub get

    - build:
        name: Generate Dart Defines (CARTO_API_KEY, API_BASE_URL, WS_BASE_URL, MOBILE_STORE_BUILD)
        # AUT-5084 / AUT-5556: The Dart defines MUST reach the Dart compile
        # inside the Xcode archive step. Flutter's xcode_backend.dart reads
        # the DART_DEFINES build setting (base64-encoded "key=value" pairs)
        # and passes them to `flutter assemble --DartDefines`.
        # Xcode Cloud injects secrets as environment variables; we encode them
        # here so the subsequent archive step inherits DART_DEFINES.
        script: |
          set -euo pipefail
          export PATH="$FLUTTER_HOME/bin:$PATH"
          
          # CARTO_API_KEY is injected by Xcode Cloud from the repository secrets
          # (configured in Xcode Cloud UI: Repository -> Secrets).
          # If unset, fail loudly instead of shipping a watermarked map.
          if [[ -z "${CARTO_API_KEY:-}" ]]; then
            echo "::error::CARTO_API_KEY secret is not configured in Xcode Cloud — release would ship a key-less (watermarked) CARTO basemap"
            exit 1
          fi
          
          # Build the define set (same 4 defines as release-ios.yml)
          DEFINES=(
            "API_BASE_URL=https://hosted.autobrainservice.app/api/v1"
            "WS_BASE_URL=wss://hosted.autobrainservice.app/ws"
            "MOBILE_STORE_BUILD=true"
            "CARTO_API_KEY=${CARTO_API_KEY}"
          )
          
          # Encode each define as base64 and join with commas
          # This mirrors flutter_tools' encodeDartDefines exactly.
          ENCODED=""
          for d in "${DEFINES[@]}"; do
            b64=$(printf '%s' "$d" | base64 | tr -d '\n')
            if [[ -z "$ENCODED" ]]; then
              ENCODED="$b64"
            else
              ENCODED="${ENCODED},${b64}"
            fi
          done
          
          # Verify round-trip (fail closed if encoding is broken)
          DECODED=()
          IFS=',' read -ra PARTS <<<"$ENCODED"
          for p in "${PARTS[@]}"; do
            DECODED+=("$(printf '%s' "$p" | base64 -d)")
          done
          if [[ "${DEFINES[*]}" != "${DECODED[*]}" ]]; then
            echo "::error::DART_DEFINES encoding did not round-trip"
            exit 1
          fi
          
          # Export for the subsequent archive step (Xcode Cloud passes env through)
          echo "DART_DEFINES=$ENCODED" >> "$GITHUB_ENV"
          echo "Generated DART_DEFINES with ${#DEFINES[@]} defines"

    - build:
        name: Archive + export (TestFlight)
        # AUT-463: archive the Runner scheme with the app-store export
        # method. The team holds an iPhone Distribution cert only, so
        # TestFlight submission uses the app-store export method (verified
        # on run 36280199047 — 'development' fails the compile step with
        # "No development certificates available to code sign app for
        # device deployment").
        action:
          - xcodebuild
          - -workspace
          - Runner.xcworkspace
          - -scheme
          - Runner
          - -configuration
          - Release
          - -destination
          - generic/platform=iOS
          - -archivePath
          - $CI_ARCHIVE_PATH
          - archive
          - -allowProvisioningUpdates
        environment:
          # App Store Connect API key material is provided by Xcode Cloud
          # through the ASC connection (AUT-433). Xcode Cloud injects the
          # distribution identity and App Store Connect key automatically
          # when the repo is linked to App Store Connect.
          export_method: app-store
          export_options:
            method: app-store
            upload_bitcode: false
            compile_bitcode: false
            strip_swift_symbols: true
            destination: export

  metadata:
    # Xcode Cloud reads the App ID from the connected App Store Connect
    # account. The bundle ID is pinned to com.autobrain.autobrain
    # (AUT-5113: PR #109 rewrites the bundle ID to the App ID Apple
    # actually registered).
    app_id: com.autobrain.autobrain
    bundle_version: 1.0.0

  signing:
    # Xcode Cloud manages signing automatically when the repo is linked
    # to App Store Connect (AUT-433). The distribution certificate and
    # App Store Connect API key are aligned through the ASC connection.
    certificate_type: distribution
    provisioning: automatic