# Xcode Cloud Workflow: App Store (release lane)
# Triggers on version tags (v*), builds and uploads to App Store Connect
# Requires: Xcode Cloud project configured, ASC API key with App Manager role
workflows:
  - name: "App Store"
    environment:
      ios: latest
      xcode: latest
    triggers:
      - type: tag
        pattern: "v*"
    steps:
      - type: build
        scheme: Runner
        configuration: Release
        clean: true
      - type: upload
        destination: app-store-connect
