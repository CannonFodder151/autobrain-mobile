name: Release App Store

on:
  tags:
    - 'v*'

env:
  IOS_BUNDLE_ID: com.autobrain.autobrain
  FLUTTER_CHANNEL: stable
  IOS_DEPLOYMENT_TARGET: "15.0"
  TARGETED_DEVICE_FAMILY: "1,2"

jobs:
  build-and-release:
    name: Build and Release to App Store
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify AppIcon manifest entries (AUT-5283)
        working-directory: .
        run: python3 scripts/check-appicon-entries.py

      - name: Verify iOS purpose strings (AUT-5322)
        working-directory: .
        run: python3 scripts/check-ios-purpose-strings.py

      - name: Verify Info.plist declares encryption use (AUT-5317)
        working-directory: .
        run: |
          set -euo pipefail
          python3 -c '
          import plistlib, sys
          d = plistlib.load(open("ios/Runner/Info.plist", "rb"))
          v = d.get("ITSAppUsesNonExemptEncryption")
          if v is not False:
              sys.exit("::error::ios/Runner/Info.plist must carry ITSAppUsesNonExemptEncryption=false, got " + repr(v))
          print("ITSAppUsesNonExemptEncryption=false (exempt: HTTPS + SHA-256 integrity)")
          '

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Pin iOS 15.0 deployment target and universal binary in generated Xcode project
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          PROJ="ios/Runner.xcodeproj/project.pbxproj"
          [[ -f "$PROJ" ]] || { echo "::error::$PROJ not found after flutter pub get"; exit 1; }
          [[ -n "${TEAM_ID:-}" ]] || { echo "::error::secrets.IOS_TEAM_ID is empty; cannot set DEVELOPMENT_TEAM"; exit 1; }
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$PROJ"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1";/TARGETED_DEVICE_FAMILY = "1,2";/g' "$PROJ"
          awk -v team="$TEAM_ID" '
            /PRODUCT_BUNDLE_IDENTIFIER = .*;/ && !/\.RunnerTests;$/ {
              print
              match($0, /^[\t ]*/)
              print substr($0, 1, RLENGTH) "DEVELOPMENT_TEAM = " team ";"
              next
            }
            { print }
          ' "$PROJ" > "$PROJ.tmp"
          mv "$PROJ.tmp" "$PROJ"
          n="$(grep -c "DEVELOPMENT_TEAM = ${TEAM_ID};" "$PROJ")"
          [[ "$n" -eq 3 ]] || { echo "::error::expected 3 DEVELOPMENT_TEAM insertions (Debug/Release/Profile), got $n"; exit 1; }
          before="$(grep -c 'CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]' "$PROJ" || true)"
          sed -i '' '/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = /d' "$PROJ"
          after="$(grep -c 'CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]' "$PROJ" || true)"
          [[ "$after" -eq 0 ]] || { echo "::error::$after CODE_SIGN_IDENTITY pins survived the delete in $PROJ"; exit 1; }
          echo "Removed $before CODE_SIGN_IDENTITY pin(s); automatic signing now resolves identity"

      - name: Verify requested version matches pubspec
        run: |
          set -euo pipefail
          version="$(grep -E '^version: ' pubspec.yaml | head -1 | awk '{print $2}')"
          tag="v${version}"
          echo "Building release ${tag} for App Store"

      - name: Detect semantic version iteration (Discord changelog gate)
        id: semver-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          req_semver="$(echo '${{ github.ref_name }}' | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "semver=$req_semver" >> "$GITHUB_OUTPUT"
          released="$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null \
            | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/' || true)"
          if grep -qx "$req_semver" <<<"$released"; then
            echo "post_discord=false" >> "$GITHUB_OUTPUT"
          else
            echo "post_discord=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Apple distribution certificate
        env:
          CERT_P12_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD || 'autobrain' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="build.keychain"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$CERT_P12_B64" | base64 --decode > /tmp/dist-cert.p12
          security import /tmp/dist-cert.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "Certificate installed in keychain $KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Materialize App Store Connect API key
        id: asc-key
        env:
          APPLE_STORE_API_KEY: ${{ secrets.APPLE_STORE_API_KEY }}
          APPLE_STORE_KEY_ID: ${{ secrets.APPLE_STORE_KEY_ID }}
          APPLE_STORE_ISSUER_ID: ${{ secrets.APPLE_STORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          [[ -n "${APPLE_STORE_API_KEY:-}" ]] || { echo "::error::secrets.APPLE_STORE_API_KEY is empty"; exit 1; }
          mkdir -p "$HOME/.app-store-connect"
          if jq -e . >/dev/null 2>&1 <<<"$APPLE_STORE_API_KEY"; then
            key_id="$(jq -r '.key_id' <<<"$APPLE_STORE_API_KEY")"
            issuer_id="$(jq -r '.issuer_id' <<<"$APPLE_STORE_API_KEY")"
            jq -r '.private_key' <<<"$APPLE_STORE_API_KEY" > "$HOME/.app-store-connect/AuthKey_${key_id}.p8"
          else
            key_id="$APPLE_STORE_KEY_ID"
            issuer_id="$APPLE_STORE_ISSUER_ID"
            [[ -n "$key_id" && -n "$issuer_id" ]] || { echo "::error::APPLE_STORE_API_KEY is a bare .p8; set APPLE_STORE_KEY_ID and APPLE_STORE_ISSUER_ID too"; exit 1; }
            printf '%s\n' "$APPLE_STORE_API_KEY" > "$HOME/.app-store-connect/AuthKey_${key_id}.p8"
          fi
          grep -q 'BEGIN PRIVATE KEY' "$HOME/.app-store-connect/AuthKey_${key_id}.p8" \
            || { echo "::error::AuthKey_${key_id}.p8 is not a PEM private key"; exit 1; }
          echo "APPLE_STORE_CONNECT_API_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "APPLE_STORE_CONNECT_API_ISSUER_ID=$issuer_id" >> "$GITHUB_ENV"
          echo "APPLE_STORE_AUTH_KEY_PATH=$HOME/.app-store-connect/AuthKey_${key_id}.p8" >> "$GITHUB_ENV"
          chmod 600 "$HOME/.app-store-connect/AuthKey_${key_id}.p8"
          altool_keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$altool_keydir"
          cp "$HOME/.app-store-connect/AuthKey_${key_id}.p8" "$altool_keydir/"
          chmod 600 "$altool_keydir/AuthKey_${key_id}.p8"
          echo "Staged AuthKey_${key_id}.p8 in $altool_keydir for altool"
          echo "App Store Connect API key ready (key id ${key_id:0:4}..., issuer ${issuer_id:0:4}...)"

      - name: Require CARTO_API_KEY and encode DART_DEFINES (AUT-5084)
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${CARTO_API_KEY:-}" ]]; then
            echo "::error::CARTO_API_KEY secret is unset — release would ship the key-less CARTO basemap (watermark tiles). Set the repo secret and re-dispatch."
            exit 1
          fi
          encoded="$(python3 - "$CARTO_API_KEY" <<'PY'
          import base64, sys
          key = sys.argv[1]
          defines = [
              "API_BASE_URL=https://hosted.autobrainservice.app/api/v1",
              "WS_BASE_URL=wss://hosted.autobrainservice.app/ws",
              "MOBILE_STORE_BUILD=true",
              "CARTO_API_KEY=" + key,
          ]
          encoded = ",".join(base64.b64encode(d.encode()).decode() for d in defines)
          decoded = [base64.b64decode(p).decode() for p in encoded.split(",")]
          if decoded != defines:
              sys.exit("::error::DART_DEFINES did not round-trip: %r" % (decoded,))
          sys.stdout.write(encoded)
          PY
          )"
          echo "DART_DEFINES=$encoded" >> "$GITHUB_ENV"
          echo "CARTO_API_KEY present (${#CARTO_API_KEY} chars); DART_DEFINES encodes 4 defines for the xcodebuild archive"

      - name: Build iOS release (export method, code-signed)
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=https://hosted.autobrainservice.app/api/v1 \
            --dart-define=WS_BASE_URL=wss://hosted.autobrainservice.app/ws \
            --dart-define=CARTO_API_KEY="$CARTO_API_KEY" \
            --dart-define=MOBILE_STORE_BUILD=true \
            --build-number="$(grep -E '^version: ' pubspec.yaml | head -1 | awk -F'[+]' '{print $2}')"

      - name: Create ExportOptions.plist (App Store = app-store method)
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ env.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          [[ -n "${TEAM_ID:-}" && -n "${BUNDLE_ID:-}" ]] || { echo "::error::team id or bundle id missing"; exit 1; }
          cat > ios/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>__TEAM_ID__</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/__TEAM_ID__/${TEAM_ID}/" ios/ExportOptions.plist
          plutil -lint ios/ExportOptions.plist
          echo "ExportOptions.plist method=app-store team=$TEAM_ID"

      - name: Archive + export .ipa (Xcode, universal device+sim build)
        env:
          KEY_ID: ${{ env.APPLE_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ env.APPLE_STORE_CONNECT_API_ISSUER_ID }}
          AUTH_KEY_PATH: ${{ env.APPLE_STORE_AUTH_KEY_PATH }}
        run: |
          set -euo pipefail
          [[ -n "${KEY_ID:-}" && -n "${ISSUER_ID:-}" && -n "${AUTH_KEY_PATH:-}" ]] || { echo "::error::App Store Connect key was not materialized"; exit 1; }
          [[ -n "${DART_DEFINES:-}" ]] || { echo "::error::DART_DEFINES is empty"; exit 1; }
          BUILD_DIR="build/ios/ipa"
          mkdir -p "$BUILD_DIR"
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$BUILD_DIR/Runner.xcarchive" \
            DART_DEFINES="$DART_DEFINES" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$BUILD_DIR/Runner.xcarchive" \
            -exportPath "$BUILD_DIR" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Verify .ipa produced
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          set -euo pipefail
          ipa="$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)"
          [[ -n "$ipa" ]] || { echo "::error::No .ipa found in build/ios/ipa/"; exit 1; }
          echo "IPA: $ipa ($(du -h "$ipa" | cut -f1))"
          [[ -n "${CARTO_API_KEY:-}" ]] || { echo "::error::CARTO_API_KEY is empty at verification time"; exit 1; }
          payload="$RUNNER_TEMP/ipa-payload"
          rm -rf "$payload"
          mkdir -p "$payload"
          unzip -q -o "$ipa" -d "$payload"
          grep -r -a -F -q -- "$CARTO_API_KEY" "$payload" \
            || { echo "::error::CARTO_API_KEY is not in the exported .ipa payload (AUT-5084)"; exit 1; }
          grep -r -a -F -q -- "hosted.autobrainservice.app" "$payload" \
            || { echo "::error::API_BASE_URL/WS_BASE_URL host missing from the .ipa payload"; exit 1; }
          echo "Verified CARTO_API_KEY and the API/WS host are present in the exported .ipa payload"

      - name: Extract changelog entry for this version (release body)
        id: changelog
        run: |
          set -euo pipefail
          semver="$(echo '${{ github.ref_name }}' | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          awk -v s="## [$semver]" 'index($0,s){f=1;next} f && /^## /{exit} f' CHANGELOG.md > "$RUNNER_TEMP/release-body.md"
          [[ -s "$RUNNER_TEMP/release-body.md" ]] || { echo "::error::CHANGELOG.md has no section for [$semver]"; exit 1; }
          { echo "# ${{ github.ref_name }}"; echo; cat "$RUNNER_TEMP/release-body.md"; } > "$RUNNER_TEMP/release-body-full.md"
          echo "body_file=$RUNNER_TEMP/release-body-full.md" >> "$GITHUB_OUTPUT"

      - name: Upload to App Store Connect (App Store)
        id: appstore
        env:
          KEY_ID: ${{ env.APPLE_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ env.APPLE_STORE_CONNECT_API_ISSUER_ID }}
          IOS_BUNDLE_ID: ${{ env.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          ipa="$(ls build/ios/ipa/*.ipa | head -1)"
          [[ -n "${KEY_ID:-}" && -n "${ISSUER_ID:-}" ]] || { echo "::error::App Store Connect key id/issuer id missing"; exit 1; }
          echo "Uploading $ipa to App Store Connect"
          xcrun altool --upload-app \
            -t ios -f "$ipa" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" \
            --output-format xml 2>&1 | tee "$RUNNER_TEMP/altool-output.xml"
          if grep -q "ERROR" "$RUNNER_TEMP/altool-output.xml"; then
            echo "::error::altool reported an error uploading $ipa"
            exit 1
          fi
          echo "altool upload to App Store Connect completed for $ipa"

      - name: Upload altool output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: altool-output
          path: ${{ runner.temp }}/altool-output.xml
          if-no-files-found: ignore

      - name: Publish GitHub Release with .ipa
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.body_file }}
          draft: false
          files: build/ios/ipa/*.ipa

      - name: Post Discord changelog + updates (App Store release)
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SEMVER: ${{ steps.semver-check.outputs.semver }}
          POST_CHANGELOG: ${{ steps.semver-check.outputs.post_discord }}
          LANE: release
        run: |
          set -euo pipefail
          notes="$(awk -v s="## [$SEMVER]" 'index($0,s){f=1;next} f && /^## /{exit} f' CHANGELOG.md \
            | grep -E '^- ' | sed 's/^- //; s/`//g; s/\*\*//g' \
            | head -3 | tr '\n' ' ' | cut -c1-400)"
          if [[ "$POST_CHANGELOG" == "true" ]]; then
            changelog_payload="$(jq -n \
              --arg channel changelog \
              --arg title "AutoBrain iOS $SEMVER released" \
              --arg desc "$notes" \
              --arg url "$RELEASE_URL" \
              --arg lane "$LANE" \
              '{channel:$channel,title:$title,description:$desc,color:"0x2ECC71",author:"Mobile Release Engineer",fields:[{name:"Download",value:$url,inline:true},{name:"Platform",value:"iOS (.ipa)",inline:true},{name:"Lane",value:$lane,inline:true}]}')"
            curl -sS -o /dev/null -w "changelog embed: %{http_code}\n" -X POST https://n8n.nathanmartina.com/webhook/discord-report \
              -H 'Content-Type: application/json' -d "$changelog_payload" || true
          fi
          updates_payload="$(jq -n \
            --arg channel updates \
            --arg title "Mobile iOS ${{ github.ref_name }} (${LANE})" \
            --arg url "$RELEASE_URL" \
            --arg lane "$LANE" \
            '{channel:$channel,title:$title,description:"Release notes + .ipa built and uploaded to App Store.",color:"0x3498DB",author:"Mobile Release Engineer",fields:[{name:"Artifact",value:"Runner.ipa",inline:true},{name:"Notes",value:"#changelog + GitHub Releases",inline:true},{name:"Lane",value:$lane,inline:true}]}')"
          curl -sS -o /dev/null -w "updates embed: %{http_code}\n" -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H 'Content-Type: application/json' -d "$updates_payload" || true