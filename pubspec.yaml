name: autobrain
description: AI-powered car enthusiast companion.
publish_to: 'none'
version: 0.3.2+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.2
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0B6B6A"
  adaptive_icon_foreground: "assets/logo.png"

