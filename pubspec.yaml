name: autobrain
description: AI-powered car enthusiast companion.
publish_to: 'none'
version: 0.3.214+221

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  package_info_plus: ^8.0.0
  sqflite: ^2.3.3+1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.2
  csv: ^6.0.0
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_blue_plus: 1.32.8
  flutter_foreground_task: ^10.0.0
  permission_handler: ^13.0.1
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.5.2
  in_app_purchase_storekit: ^0.4.11+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_secure_storage_platform_interface: ^2.0.3
  geolocator_platform_interface: ^4.2.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icon.png"
