name: Mobile Release (.aab)

# Manual release pipeline: build + sign + published GitHub Release + Discord notes.
# Release is auto-published (not a draft) so it never stalls in draft backlog.
# The .aab is then uploaded to the existing Play Console closed testing track
# (alpha, which has testers) automatically (scripts/play-upload-closed-testing.sh)
# — see docs/mobile-release.md.
# See docs/mobile-release.md (autobrain monorepo). Never runs on push.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build, e.g. v0.3.4+21 (must match pubspec.yaml version X.Y.Z+N)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]
    # Job-level env so every step sees ANDROID_HOME / ANDROID_SDK_ROOT.
    # The self-hosted runner (gh-runner-autobrain-mobile) has no `unzip`
    # and `android-actions/setup-android@v3` can't locate the preinstalled
    # sdkmanager (which() strips PATH-less absolute paths), so we install
    # everything via direct zip + Python zipfile. Errors are NOT swallowed —
    # silent `>/dev/null 2>&1 || true` masked the sdkmanager failure for
    # weeks (AUT-2064 / AUT-2078).
    env:
      ANDROID_SDK_ROOT: "/home/administrator/.android/sdk"
      ANDROID_HOME: "/home/administrator/.android/sdk"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK cmdline-tools (manual zip — no unzip on runner)
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          rm -rf /tmp/cmdline-tools-extract && mkdir -p /tmp/cmdline-tools-extract
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/cmdline-tools.zip').extractall('/tmp/cmdline-tools-extract')"
          rm /tmp/cmdline-tools.zip
          SDKMGR="$(find /tmp/cmdline-tools-extract -name sdkmanager -type f | head -1)"
          [ -n "$SDKMGR" ] || { echo "::error::sdkmanager not found in extracted cmdline-tools"; find /tmp/cmdline-tools-extract -type f | head -10; exit 1; }
          SDK_TOOLS_DIR="$(dirname "$(dirname "$SDKMGR")")"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          cp -r "$SDK_TOOLS_DIR"/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          rm -rf /tmp/cmdline-tools-extract
          # Make sure sdkmanager is executable on this runner (matters if
          # the cp above carried an unexpected mode; previous CI runs hit
          # "Unable to locate executable file" from android-actions).
          chmod +x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || true
          echo "cmdline-tools installed at $ANDROID_SDK_ROOT/cmdline-tools/latest"
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

      - name: Install Android SDK platforms;37 + build-tools;37.0.0 + platform-tools + NDK r27 (sdkmanager)
        # self-hosted gh-runner-autobrain-mobile has no `unzip` and
        # cmdline-tools 16.0's `sdkmanager --console` was removed (AUT-2064).
        # The previous attempt called sdkmanager but masked the exit
        # status (`>/dev/null 2>&1 || true`) so a silent failure looked
        # like a success. Don't do that — let sdkmanager fail loudly.
        # Licenses are pre-accepted in the prior step so sdkmanager
        # doesn't prompt or auto-re-install packages.
        # Includes NDK r27 because android/app/build.gradle pins
        # `ndkVersion "27.0.12077973"`; AGP tries to auto-install NDK
        # otherwise and trips a LicenceNotAcceptedException.
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --version
          # Install everything in one call. sdkmanager is idempotent.
          # Output is NOT redirected — failures surface immediately.
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;27.0.12077973"
          echo "Android SDK ready: platforms=$(ls "$ANDROID_SDK_ROOT/platforms" | tr '\n' ' ') build-tools=$(ls "$ANDROID_SDK_ROOT/build-tools" | tr '\n' ' ') platform-tools=$(ls "$ANDROID_SDK_ROOT/platform-tools" | head -3 | tr '\n' ' ') ndk=$(ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null | tr '\n' ' ')"

      - name: Pre-accept Android SDK licenses (NDK + platforms/build-tools accept hashes)
        # AGP fails the build with LicenceNotAcceptedException if it has to
        # auto-install any SDK package (e.g. NDK) and the matching license
        # hash isn't already on disk. The well-known SHA1 hashes for SDK
        # and NDK accept-licenses are written to $ANDROID_SDK_ROOT/licenses
        # before the build runs. Same hashes the local autobrain dev
        # workstation has.
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\\n24333f8a63b6825ea9c5514f83c2829b004d1fee\\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          printf "\\n859f317696f67ef3d7f30a50a5560e7834b43903" > "$ANDROID_SDK_ROOT/licenses/android-sdk-arm-dbt-license"
          printf "\\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$ANDROID_SDK_ROOT/licenses/intel-android-extra-license"
          cat "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "---"
          ls -la "$ANDROID_SDK_ROOT/licenses"

      - name: Pin Android SDK location for Flutter (local.properties + flutter config)
        # Flutter on Linux self-hosted runners ignores ANDROID_HOME / ANDROID_SDK_ROOT
        # unless `android/local.properties` declares sdk.dir (AUT-2078). Drop a
        # local.properties so Gradle/Flutter both find the SDK at the path the
        # earlier steps installed it to. `flutter config --android-sdk` is the
        # belt-and-braces fallback for `flutter doctor` checks.
        run: |
          set -euo pipefail
          SDK="/home/administrator/.android/sdk"
          mkdir -p android
          {
            echo "sdk.dir=$SDK"
            echo "flutter.versionCode=$(grep -E '^version: ' pubspec.yaml | head -1 | awk -F'+' '{print $2}')"
            echo "flutter.versionName=$(grep -E '^version: ' pubspec.yaml | head -1 | awk '{print $2}' | sed 's/+.*//')"
          } > android/local.properties
          cat android/local.properties
          flutter config --android-sdk "$SDK" || true

      - name: Verify Android SDK installation (fail fast on any missing piece)
        run: |
          set -euo pipefail
          SDK="/home/administrator/.android/sdk"
          for d in cmdline-tools/latest/bin/sdkmanager platforms/android-37.0 build-tools/37.0.0 platform-tools/adb ndk/27.0.12077973/source.properties; do
            if [ ! -e "$SDK/$d" ]; then
              echo "::error::missing SDK piece: $SDK/$d"
              exit 1
            fi
          done
          echo "=== SDK root ==="; ls -la "$SDK"
          echo "=== platforms ==="; ls "$SDK/platforms"
          echo "=== build-tools ==="; ls "$SDK/build-tools"
          echo "=== platform-tools (first 5) ==="; ls "$SDK/platform-tools" | head -5
          echo "=== ndk ==="; ls "$SDK/ndk"
          echo "=== sdkmanager ==="; "$SDK/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Verify requested version matches pubspec
        run: |
          set -euo pipefail
          version="$(grep -E '^version: ' pubspec.yaml | head -1 | awk '{print $2}')"
          tag="v${version}"
          if [[ "$tag" != "${{ inputs.version }}" ]]; then
            echo "::error::pubspec.yaml version is ${tag} but requested ${{ inputs.version }}. Run bump-version.sh --mobile in the autobrain monorepo first."
            exit 1
          fi
          echo "Building release ${tag}"

      - name: Detect semantic version iteration (Discord changelog gate)
        id: semver-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Semantic version (X.Y.Z) of the requested release, e.g. v0.3.7+30 -> 0.3.7.
          req_semver="$(echo '${{ inputs.version }}' | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "semver=$req_semver" >> "$GITHUB_OUTPUT"
          # Has any release (draft or published, build series included) already
          # announced this semantic version? One announcement per version.
          released="$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null \
            | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/' || true)"
          if grep -qx "$req_semver" <<<"$released"; then
            echo "Version ${req_semver} already released/announced — build-only, skipping #changelog post"
            echo "post_discord=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${req_semver} — #changelog post enabled"
            echo "post_discord=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android keystore + key.properties
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          cp android/upload-keystore.jks android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$KEY_STORE_PASSWORD
          EOF
          ls -la android/ android/app/*.jks

      - name: Verify Play-locked package identity
        run: |
          set -euo pipefail
          grep -q 'namespace "com.autobrainservice.app"' android/app/build.gradle || { echo "::error::build.gradle namespace is not com.autobrainservice.app"; exit 1; }
          grep -q 'applicationId "com.autobrainservice.app"' android/app/build.gradle || { echo "::error::build.gradle applicationId is not com.autobrainservice.app"; exit 1; }
          head -1 android/app/src/main/kotlin/com/autobrainservice/app/MainActivity.kt | grep -q 'package com.autobrainservice.app' || { echo "::error::MainActivity.kt package is not com.autobrainservice.app"; exit 1; }
          echo "package identity OK: com.autobrainservice.app"

      - name: flutter pub get
        run: flutter pub get

      - name: Build release appbundle
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://hosted.autobrainservice.app/api/v1 \
            --dart-define=WS_BASE_URL=wss://hosted.autobrainservice.app/ws \
            --dart-define=MOBILE_STORE_BUILD=true

      - name: Build release APK (same signingConfig, for apksigner scheme check)
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://hosted.autobrainservice.app/api/v1 \
            --dart-define=WS_BASE_URL=wss://hosted.autobrainservice.app/ws \
            --dart-define=MOBILE_STORE_BUILD=true

      - name: Verify signing (AAB v1, APK v2/v3)
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          apk=build/app/outputs/flutter-apk/app-release.apk
          [[ -f "$aab" ]] || { echo "::error::$aab not found"; exit 1; }
          [[ -f "$apk" ]] || { echo "::error::$apk not found"; exit 1; }
          if ! command -v jarsigner >/dev/null 2>&1 && [[ -n "${JAVA_HOME:-}" ]]; then
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          echo "== jarsigner -verify $aab (v1/JAR signature on bundle container) =="
          jarsigner -verify "$aab"
          echo "== signer identity of $aab =="
          keytool -printcert -jarfile "$aab" 2>/dev/null | grep -E "Owner|SHA256" | head -3 || true
          echo "== upload-key fingerprint guard (Play expects machine keystore) =="
          expected_sha1="F3:79:19:3F:F7:28:54:BE:46:01:6E:CB:FF:43:DC:15:DF:BF:FB:4C"
          actual_sha1="$(keytool -printcert -jarfile "$aab" 2>/dev/null | grep -E '^\s*SHA1:' | head -1 | awk '{print $2}')"
          [[ "$actual_sha1" == "$expected_sha1" ]] || { echo "::error::AAB signer SHA1 ${actual_sha1:-<none>} != expected $expected_sha1 (wrong upload keystore in CI secrets)"; exit 1; }
          echo "AAB signer SHA1 matches Play upload key: $actual_sha1"
          apksigner="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | tail -1)"
          echo "== $apksigner verify --verbose --print-certs $apk =="
          out="$("$apksigner" verify --verbose --print-certs "$apk")"
          echo "$out"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" <<<"$out" || { echo "::error::APK missing v2 scheme (Play requires it)"; exit 1; }
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" <<<"$out" || { echo "::error::APK missing v3 scheme (Play requires it)"; exit 1; }
          grep -q "Verified using v1 scheme (JAR signing): true" <<<"$out" || echo "note: APK has no v1 (JAR) scheme — expected with minSdk >= 24; Play requires v2/v3"
          expected_sha1_hex="f379193ff72854be46016ecbff43dc15dfbffb4c"
          actual_sha1_hex="$(echo "$out" | grep 'certificate SHA-1 digest' | awk '{print $NF}')"
          [[ "$actual_sha1_hex" == "$expected_sha1_hex" ]] || { echo "::error::APK signer SHA-1 ${actual_sha1_hex:-<none>} != expected $expected_sha1_hex (wrong upload keystore in CI secrets)"; exit 1; }
          echo "APK signer SHA-1 matches Play upload key: $actual_sha1_hex"
          echo "signing OK: AAB v1 valid; APK v2+v3 valid with upload certificate"

      - name: Extract changelog entry for this version (release body)
        id: changelog
        run: |
          awk -v s="## [$SEMVER]" 'index($0,s){f=1;next} f && /^## /{exit} f' CHANGELOG.md > "$RUNNER_TEMP/release-body.md"
          [[ -s "$RUNNER_TEMP/release-body.md" ]] || { echo "::error::CHANGELOG.md has no section for [$SEMVER]"; exit 1; }
          { echo "# ${{ inputs.version }}"; echo; cat "$RUNNER_TEMP/release-body.md"; } > "$RUNNER_TEMP/release-body-full.md"
          echo "body_file=$RUNNER_TEMP/release-body-full.md" >> "$GITHUB_OUTPUT"
        env:
          SEMVER: ${{ steps.semver-check.outputs.semver }}

      - name: Publish GitHub Release with .aab (published, never a draft)
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body_path: ${{ steps.changelog.outputs.body_file }}
          draft: false
          files: build/app/outputs/bundle/release/app-release.aab

      - name: Upload .aab to Play Console closed testing (automated)
        id: play_upload
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver="${{ steps.semver-check.outputs.semver }}"
          export PLAY_RELEASE_NOTES="$(awk -v s="## [$semver]" 'index($0,s){f=1;next} f && /^## /{exit} f' CHANGELOG.md \
            | grep -E '^- ' | sed 's/^- //; s/`//g; s/\*\*//g' | head -3 | tr '\n' ' ' | cut -c1-400)"
          export PLAY_RELEASE_NOTES="${PLAY_RELEASE_NOTES% } — autoBrain $RELEASE_VERSION"
          export PLAY_LOG_FILE="$RUNNER_TEMP/play-upload.log"
          bash scripts/play-upload-closed-testing.sh build/app/outputs/bundle/release/app-release.aab

      - name: Ask Nathan for one-time closed-testing tester audience (approvals)
        if: steps.play_upload.outputs.needs_tester_audience == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          payload="$(jq -n \
            --arg channel approvals \
            --arg title "Play closed-testing upload needs tester audience" \
            --arg desc "Auto-upload to the closed testing track (alpha) worked, but Play blocks submit-for-review until the track has testers. One-time setup in Play Console (Testing > Closed testing > alpha): add testers + country availability (restOfWorld on). After that every release auto-submits for review." \
            --arg version "$VERSION" \
            '{channel:$channel,title:$title,description:$desc,color:"0x5865F2",author:"Mobile Release Engineer",fields:[{name:"Version",value:$version,inline:true},{name:"Ask",value:"Configure testers once",inline:true}]}')"
          curl -sS -o /dev/null -w "approvals embed: %{http_code}\n" -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H 'Content-Type: application/json' -d "$payload" || true

      - name: Post Discord changelog + updates (n8n Reporter)
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SEMVER: ${{ steps.semver-check.outputs.semver }}
          POST_CHANGELOG: ${{ steps.semver-check.outputs.post_discord }}
        run: |
          # Summarized changelog for this semantic version: its section bullets,
          # stripped of markdown markers, joined on one line.
          notes="$(awk -v s="## [$SEMVER]" 'index($0,s){f=1;next} f && /^## /{exit} f' CHANGELOG.md \
            | grep -E '^- ' | sed 's/^- //; s/`//g; s/\*\*//g' \
            | head -3 | tr '\n' ' ' | cut -c1-400)"
          # Customer-facing #changelog: only announce a new semantic version
          # (0.3.6 -> 0.3.7), not every build of the same version.
          if [[ "$POST_CHANGELOG" == "true" ]]; then
            changelog_payload="$(jq -n \
              --arg channel changelog \
              --arg title "AutoBrain app $SEMVER released" \
              --arg desc "$notes" \
              --arg url "$RELEASE_URL" \
              '{channel:$channel,title:$title,description:$desc,color:"0x2ECC71",author:"Mobile Release Engineer",fields:[{name:"Download",value:$url,inline:true},{name:"Platform",value:"Android (.aab)",inline:true}]}')"
            curl -sS -o /dev/null -w "changelog embed: %{http_code}\n" -X POST https://n8n.nathanmartina.com/webhook/discord-report \
              -H 'Content-Type: application/json' -d "$changelog_payload" || true
          else
            echo "skipping #changelog embed: $SEMVER already announced (build-only)"
          fi
          # Staff #updates: every build stays visible internally.
          updates_payload="$(jq -n \
            --arg channel updates \
            --arg title "Mobile .aab ${{ inputs.version }} released" \
            --arg url "$RELEASE_URL" \
            '{channel:$channel,title:$title,description:"Release notes + .aab live.",color:"0x3498DB",author:"Mobile Release Engineer",fields:[{name:"Artifact",value:"app-release.aab",inline:true},{name:"Notes",value:"#changelog + GitHub Releases",inline:true},{name:"Download",value:$url,inline:true}]}')"
          # Discord embeds are best-effort: a transient n8n outage must not fail the
          # release run (it only creates failure-notification spam).
          curl -sS -o /dev/null -w "updates embed: %{http_code}\n" -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H 'Content-Type: application/json' -d "$updates_payload" || true