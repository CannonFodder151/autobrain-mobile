name: Mobile Release (.aab)

# Manual release pipeline: build + sign + published GitHub Release + Discord notes.
# Release is auto-published (not a draft) so it never stalls in draft backlog.
# The .aab is then uploaded to the existing Play Console closed testing track
# (alpha, which has testers) automatically (scripts/play-upload-closed-testing.sh)
# — see docs/mobile-release.md.
# See docs/mobile-release.md (autobrain monorepo). Never runs on push.
#
# RUNNER TRUST MODEL (AUT-4722) — this is the only workflow that loads
# UPLOAD_KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD / KEY_STORE_PASSWORD /
# GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, and it has `contents: write`.
# It therefore MUST be the only workflow permitted to run on
# gh-runner-autobrain-mobile. The runner is non-ephemeral, so any job that
# executed PR-authored code on it could plant an artifact that this job then
# executes. Rules enforced by scripts/check-workflow-runner-isolation.sh (run in
# analyze.yml, fails the build):
#   * no pull_request / pull_request_target trigger may target a self-hosted
#     runner — PR triggers execute the workflow file from the PR head;
#   * analyze.yml runs on ubuntu-latest, not here;
#   * the `release-signing` label is claimed by this workflow alone. Adding it
#     to another workflow widens the trust boundary to whatever else that
#     workflow runs, so the guard fails on a second claimant.
#
# The `release-signing` label is a dedicated-runner claim: it is registered on
# gh-runner-autobrain-mobile only (see the repo's runner list), and moving this
# job to a different box is a label registration, not a code change — the
# workflow already targets it. Do not drop the label: `[self-hosted, linux,
# x64]` alone matches any future self-hosted Linux runner, which would silently
# re-share the signing secrets with whatever that runner is used for.

# AUT-4766: dispatch-only. This repo is private on a GitHub Free plan, so
# branch protection AND rulesets both return 403 ("Upgrade to GitHub Pro") —
# there is no server-side gate on who may push to main. A `push: main` trigger
# therefore turned "anyone with write access pushes" into "signed Play upload",
# with no review step in between. workflow_dispatch requires write access AND
# an explicit human action. Reinforced by rule 3 of
# scripts/check-workflow-runner-isolation.sh.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build, e.g. v0.3.4+21 (must match pubspec.yaml version X.Y.Z+N)'
        required: true
        type: string
      bypass_apk_throttle:
        description: 'Bypass the 48h APK throttle (true/false). Use only for hotfix releases that need an APK the same day as the last one.'
        required: false
        type: string
        default: 'false'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux, x64, release-signing]
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth:0 so the apk-decision step can diff against the
          # previous release tag (parent commit) and read the floating
          # apk-built tag ref.
          fetch-depth: 0

      - name: Resolve release version (dispatch input)
        # Dispatch-only (AUT-4766), so inputs.version is always present.
        run: |
          set -euo pipefail
          tag="${{ inputs.version }}"
          tag="${tag#v}"
          tag="v${tag}"
          echo "Resolved release tag: $tag"
          echo "RELEASE_VERSION=$tag" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3.2.2 still asks sdkmanager for the deprecated `tools` package,
      # which Google no longer serves -> `Failed to find package 'tools'`,
      # sdkmanager exits 1 and the whole Android release dies at this step.
      # v4 filters that package out (its cmdline-tools replaces it).
      - uses: android-actions/setup-android@v4

      - name: Fix SDK execute bits (cold runner AUT-2176)
        # android-actions/setup-android installs cmdline-tools and build-tools with
        # non-executable bits on cold gh-runner-autobrain-mobile runners. Two
        # failures seen:
        #   - flutter_tools -> apkanalyzer:
        #       ProcessException: ... lacked sufficient permissions to execute
        #       .../cmdline-tools/latest/bin/apkanalyzer
        #   - signing verify -> apksigner:
        #       /bin/sh: .../build-tools/latest/apksigner: Permission denied
        # chmod u+x is idempotent and safe across warm/cold runners. AUT-2064
        # fixed sdkmanager; this step closes the apkanalyzer + apksigner halves.
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          shopt -s nullglob
          if [[ -n "$sdk" && -d "$sdk/cmdline-tools" ]]; then
            for bin_dir in "$sdk"/cmdline-tools/*/bin; do
              echo "fixing exec bits in $bin_dir"
              chmod -R u+x "$bin_dir"
            done
          fi
          if [[ -n "$sdk" && -d "$sdk/build-tools" ]]; then
            for bt_dir in "$sdk"/build-tools/*; do
              [[ -d "$bt_dir" ]] || continue
              echo "fixing exec bits in $bt_dir"
              chmod -R u+x "$bt_dir"
            done
          fi
          echo "apkanalyzer perms: $(stat -c '%a %n' "$sdk"/cmdline-tools/*/bin/apkanalyzer 2>/dev/null || echo 'n/a')"
          echo "apksigner perms: $(stat -c '%a %n' "$sdk"/build-tools/*/apksigner 2>/dev/null || echo 'n/a')"

      - name: Install Android SDK (platforms;37.0, build-tools;37.0.0, platform-tools)
        run: |
          set -euo pipefail
          # Self-hosted gh-runner-autobrain-mobile has no `unzip` and cmdline-tools
          # 16.0 dropped `sdkmanager --console` (AUT-2064), so install the SDK pieces
          # we need by direct-download zip + Python zipfile, then symlink so cold
          # runners match the locally-verified layout. Verified artifacts:
          #   platform-37.0_r02.zip      -> platforms/android-37.0
          #   build-tools_r37_linux.zip  -> build-tools/37.0.0 (+ latest symlink)
          #   platform-tools_r37.0.1-linux.zip -> platform-tools/
          extract() { python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$1" "$2"; }
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r02.zip
            rm -rf /tmp/platform-37-extract && mkdir -p /tmp/platform-37-extract
            extract /tmp/platform-37.zip /tmp/platform-37-extract
            mkdir -p "$ANDROID_SDK_ROOT/platforms"
            mv /tmp/platform-37-extract/android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37.0"
            rm -rf /tmp/platform-37-extract /tmp/platform-37.zip
          fi
          if [ ! -d "$ANDROID_SDK_ROOT/build-tools/37.0.0" ]; then
            curl -fsSL -o /tmp/build-tools-37.zip https://dl.google.com/android/repository/build-tools_r37_linux.zip
            rm -rf /tmp/build-tools-extract && mkdir -p /tmp/build-tools-extract
            extract /tmp/build-tools-37.zip /tmp/build-tools-extract
            mkdir -p "$ANDROID_SDK_ROOT/build-tools"
            mv /tmp/build-tools-extract/android-37.0 "$ANDROID_SDK_ROOT/build-tools/37.0.0"
            rm -rf /tmp/build-tools-extract /tmp/build-tools-37.zip
          fi
          if [ ! -d "$ANDROID_SDK_ROOT/platform-tools" ]; then
            curl -fsSL -o /tmp/platform-tools.zip https://dl.google.com/android/repository/platform-tools_r37.0.1-linux.zip
            rm -rf /tmp/platform-tools-extract && mkdir -p /tmp/platform-tools-extract
            extract /tmp/platform-tools.zip /tmp/platform-tools-extract
            mkdir -p "$ANDROID_SDK_ROOT/platform-tools"
            mv /tmp/platform-tools-extract/platform-tools/* "$ANDROID_SDK_ROOT/platform-tools/"
            rm -rf /tmp/platform-tools-extract /tmp/platform-tools.zip
          fi
          [ -e "$ANDROID_SDK_ROOT/build-tools/latest" ] || ln -s 37.0.0 "$ANDROID_SDK_ROOT/build-tools/latest"
          for sdk in "$ANDROID_SDK_ROOT" "/root/.android/sdk"; do
            [ -z "$sdk" ] && continue
            if [ -d "$sdk/platforms/android-37.0" ] && [ ! -e "$sdk/platforms/android-37" ]; then
              ln -s android-37.0 "$sdk/platforms/android-37"
              echo "Created symlink $sdk/platforms/android-37 -> android-37.0"
            fi
          done
          echo "Android SDK ready: platforms=$(ls "$ANDROID_SDK_ROOT/platforms" | tr '\n' ' ') build-tools=$(ls "$ANDROID_SDK_ROOT/build-tools" | tr '\n' ' ') platform-tools=$(ls "$ANDROID_SDK_ROOT/platform-tools" | head -3 | tr '\n' ' ')"

      - name: Verify requested version matches pubspec
        run: |
          set -euo pipefail
          version="$(grep -E '^version: ' pubspec.yaml | head -1 | awk '{print $2}')"
          tag="v${version}"
          if [[ "$tag" != "${{ env.RELEASE_VERSION }}" ]]; then
            echo "::error::pubspec.yaml version is ${tag} but requested ${{ env.RELEASE_VERSION }}. Run bump-version.sh --mobile in the autobrain monorepo first."
            exit 1
          fi
          echo "Building release ${tag}"

      - name: Detect semantic version iteration (Discord changelog gate)
        id: semver-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Semantic version (X.Y.Z) of the requested release, e.g. v0.3.7+30 -> 0.3.7.
          req_semver="$(echo "$RELEASE_VERSION" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "semver=$req_semver" >> "$GITHUB_OUTPUT"
          # Has any release (draft or published, build series included) already
          # announced this semantic version? One announcement per version.
          released="$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null \
            | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/' || true)"
          if grep -qx "$req_semver" <<<"$released"; then
            echo "Version ${req_semver} already released/announced — build-only, skipping #changelog post"
            echo "post_discord=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${req_semver} — #changelog post enabled"
            echo "post_discord=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android keystore + key.properties
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          cp android/upload-keystore.jks android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$KEY_STORE_PASSWORD
          EOF
          ls -la android/ android/app/*.jks

      - name: Verify Play-locked package identity
        run: |
          set -euo pipefail
          grep -q 'namespace "com.autobrainservice.app"' android/app/build.gradle || { echo "::error::build.gradle namespace is not com.autobrainservice.app"; exit 1; }
          grep -q 'applicationId "com.autobrainservice.app"' android/app/build.gradle || { echo "::error::build.gradle applicationId is not com.autobrainservice.app"; exit 1; }
          head -1 android/app/src/main/kotlin/com/autobrainservice/app/MainActivity.kt | grep -q 'package com.autobrainservice.app' || { echo "::error::MainActivity.kt package is not com.autobrainservice.app"; exit 1; }
          echo "package identity OK: com.autobrainservice.app"

      - name: flutter pub get
        run: flutter pub get

      - name: Build release appbundle
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://hosted.autobrainservice.app/api/v1 \
            --dart-define=WS_BASE_URL=wss://hosted.autobrainservice.app/ws \
            --dart-define=MOBILE_STORE_BUILD=true

      - name: Decide whether to build the APK (2-day throttle + meaningful change gate)
        id: apk-decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # actions/checkout@v4 defaults to fetch-depth:1, so parent commits
          # and the floating apk-built tag ref are not fetched. Unshallow so
          # the meaningful-change diff + 48h throttle read both work.
          git fetch --unshallow 2>/dev/null || true
          git fetch origin apk-built 2>/dev/null || true
          semver="$(echo '${{ env.RELEASE_VERSION }}' | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          prev_tag="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            changed_files="$(git diff --name-only "$prev_tag" HEAD -- lib/ assets/ 2>/dev/null || true)"
          else
            changed_files="lib/"
          fi
          has_meaningful=false
          [ -n "$changed_files" ] && has_meaningful=true
          echo "has_meaningful=$has_meaningful" >> "$GITHUB_OUTPUT"
          apk_built_at="$(git show -s --format=%cI apk-built 2>/dev/null || echo '')"
          echo "apk_built_at=${apk_built_at:-<none>}" >> "$GITHUB_OUTPUT"
          bypass="${{ inputs.bypass_apk_throttle }}"
          echo "bypass_apk_throttle=${bypass}" >> "$GITHUB_OUTPUT"
          build_apk=false
          if [ "$bypass" = "true" ]; then
            echo "APK throttle bypassed by dispatch override" >&2
            build_apk=true
          else
            if [ "$has_meaningful" = "true" ]; then
              if [ -z "$apk_built_at" ]; then
                build_apk=true
              else
                last_epoch="$(date -d "$apk_built_at" +%s 2>/dev/null || echo 0)"
                now_epoch="$(date -u +%s)"
                age_hours=$(( (now_epoch - last_epoch) / 3600 ))
                echo "hours_since_last_apk=$age_hours" >> "$GITHUB_OUTPUT"
                [ "$age_hours" -ge 48 ] && build_apk=true
              fi
            fi
          fi
          echo "build_apk=$build_apk" >> "$GITHUB_OUTPUT"

      - name: Build release APK (same signingConfig, for apksigner scheme check)
        if: steps.apk-decision.outputs.build_apk == 'true'
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://hosted.autobrainservice.app/api/v1 \
            --dart-define=WS_BASE_URL=wss://hosted.autobrainservice.app/ws \
            --dart-define=MOBILE_STORE_BUILD=true

      - name: Skip APK build — throttled (AUT-2619)
        if: steps.apk-decision.outputs.build_apk == 'false'
        run: |
          echo "::notice::APK build skipped: no meaningful lib/asset change since last APK build, or within 48h cooldown. .aab already produced for Play Console."

      - name: Verify .aab signing (v1/JAR) — always runs
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          [[ -f "$aab" ]] || { echo "::error::$aab not found"; exit 1; }
          if ! command -v jarsigner >/dev/null 2>&1 && [[ -n "${JAVA_HOME:-}" ]]; then
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          echo "== jarsigner -verify $aab (v1/JAR signature on bundle container) =="
          jarsigner -verify "$aab"
          echo "== signer identity of $aab =="
          keytool -printcert -jarfile "$aab" 2>/dev/null | grep -E "Owner|SHA256" | head -3 || true
          echo "== upload-key fingerprint guard (Play expects machine keystore) =="
          expected_sha1="F3:79:19:3F:F7:28:54:BE:46:01:6E:CB:FF:43:DC:15:DF:BF:FB:4C"
          actual_sha1="$(keytool -printcert -jarfile "$aab" 2>/dev/null | grep -E '^\s*SHA1:' | head -1 | awk '{print $2}')"
          [[ "$actual_sha1" == "$expected_sha1" ]] || { echo "::error::AAB signer SHA1 ${actual_sha1:-<none> } != expected $expected_sha1 (wrong upload keystore in CI secrets)"; exit 1; }
          echo "AAB signer SHA1 matches Play upload key: $actual_sha1"

      - name: Verify APK signing (v2+v3 scheme check) — only when APK was built
        if: steps.apk-decision.outputs.build_apk == 'true'
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          [[ -f "$apk" ]] || { echo "::error::$apk not found"; exit 1; }
          apksigner="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | tail -1)"
          echo "== $apksigner verify --verbose --print-certs $apk =="
          out="$("$apksigner" verify --verbose --print-certs "$apk")"
          echo "$out"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" <<<"$out" || { echo "::error::APK missing v2 scheme (Play requires it)"; exit 1; }
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" <<<"$out" || { echo "::error::APK missing v3 scheme (Play requires it)"; exit 1; }
          grep -q "Verified using v1 scheme (JAR signing): true" <<<"$out" || echo "note: APK has no v1 (JAR) scheme — expected with minSdk >= 24; Play requires v2+v3"
          expected_sha1_hex="f379193ff72854be46016ecbff43dc15dfbffb4c"
          actual_sha1_hex="$(echo "$out" | grep 'certificate SHA-1 digest' | awk '{print $NF}')"
          [[ "$actual_sha1_hex" == "$expected_sha1_hex" ]] || { echo "::error::APK signer SHA-1 ${actual_sha1_hex:-<none>} != expected $expected_sha1_hex (wrong upload keystore in CI secrets)"; exit 1; }
          echo "APK signer SHA-1 matches Play upload key: $actual_sha1_hex"
          echo "signing OK: AAB v1 valid; APK v2+v3 valid with upload certificate"

      - name: Extract changelog entry for this version (release body)
        id: changelog
        run: |
          awk -v s="## [$SEMVER]" 'index($0,s){f=1;next} f && /^## /{exit} f' CHANGELOG.md > "$RUNNER_TEMP/release-body.md"
          [[ -s "$RUNNER_TEMP/release-body.md" ]] || { echo "::error::CHANGELOG.md has no section for [$SEMVER]"; exit 1; }
          { echo "# ${{ env.RELEASE_VERSION }}"; echo; cat "$RUNNER_TEMP/release-body.md"; } > "$RUNNER_TEMP/release-body-full.md"
          echo "body_file=$RUNNER_TEMP/release-body-full.md" >> "$GITHUB_OUTPUT"
        env:
          SEMVER: ${{ steps.semver-check.outputs.semver }}

      - name: Publish GitHub Release with .aab (published, never a draft)
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          body_path: ${{ steps.changelog.outputs.body_file }}
          draft: false
          files: build/app/outputs/bundle/release/app-release.aab

      - name: Mark APK build time (gates 2-day throttle)
        if: steps.apk-decision.outputs.build_apk == 'true'
        run: |
          set -euo pipefail
          # Floating tag ref stores the last APK build time. Update it after
          # each successful APK build so the 2-day cooldown gate sees the
          # new timestamp on the next release-mobile run.
          git config user.name "AutoBrain Release Bot"
          git config user.email "release@autobrainservice.app"
          git tag -f apk-built HEAD
          git push -f origin apk-built

      - name: Upload .aab to Play Console closed testing (automated)
        id: play_upload
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          semver="${{ steps.semver-check.outputs.semver }}"
          export PLAY_RELEASE_NOTES="$(awk -v s="## [$semver]" 'index($0,s){f=1;next} f && /^## /{exit} f' CHANGELOG.md \
            | grep -E '^- ' | sed 's/^- //; s/`//g; s/\*\*//g' | head -3 | tr '\n' ' ' | cut -c1-400)"
          export PLAY_RELEASE_NOTES="${PLAY_RELEASE_NOTES% } — autoBrain $RELEASE_VERSION"
          export PLAY_LOG_FILE="$RUNNER_TEMP/play-upload.log"
          bash scripts/play-upload-closed-testing.sh build/app/outputs/bundle/release/app-release.aab

      - name: Ask Nathan for one-time closed-testing tester audience (approvals)
        if: steps.play_upload.outputs.needs_tester_audience == 'true'
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          payload="$(jq -n \
            --arg channel approvals \
            --arg title "Play closed-testing upload needs tester audience" \
            --arg desc "Auto-upload to the closed testing track (alpha) worked, but Play blocks submit-for-review until the track has testers. One-time setup in Play Console (Testing > Closed testing > alpha): add testers + country availability (restOfWorld on). After that every release auto-submits for review." \
            --arg version "$VERSION" \
            '{channel:$channel,title:$title,description:$desc,color:"0x5865F2",author:"Mobile Release Engineer",fields:[{name:"Version",value:$version,inline:true},{name:"Ask",value:"Configure testers once",inline:true}]}')"
          curl -sS -o /dev/null -w "approvals embed: %{http_code}\n" -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H 'Content-Type: application/json' -d "$payload" || true

      - name: Post Discord changelog + updates (n8n Reporter)
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SEMVER: ${{ steps.semver-check.outputs.semver }}
          POST_CHANGELOG: ${{ steps.semver-check.outputs.post_discord }}
        run: |
          # Summarized changelog for this semantic version: its section bullets,
          # stripped of markdown markers, joined on one line.
          notes="$(awk -v s="## [$SEMVER]" 'index($0,s){f=1;next} f && /^## /{exit} f' CHANGELOG.md \
            | grep -E '^- ' | sed 's/^- //; s/`//g; s/\*\*//g' \
            | head -3 | tr '\n' ' ' | cut -c1-400)"
          # Customer-facing #changelog: only announce a new semantic version
          # (0.3.6 -> 0.3.7), not every build of the same version.
          if [[ "$POST_CHANGELOG" == "true" ]]; then
            changelog_payload="$(jq -n \
              --arg channel changelog \
              --arg title "AutoBrain app $SEMVER released" \
              --arg desc "$notes" \
              --arg url "$RELEASE_URL" \
              '{channel:$channel,title:$title,description:$desc,color:"0x2ECC71",author:"Mobile Release Engineer",fields:[{name:"Download",value:$url,inline:true},{name:"Platform",value:"Android (.aab)",inline:true}]}')"
            curl -sS -o /dev/null -w "changelog embed: %{http_code}\n" -X POST https://n8n.nathanmartina.com/webhook/discord-report \
              -H 'Content-Type: application/json' -d "$changelog_payload" || true
          else
            echo "skipping #changelog embed: $SEMVER already announced (build-only)"
          fi
          # Staff #updates: every build stays visible internally.
          updates_payload="$(jq -n \
            --arg channel updates \
            --arg title "Mobile .aab ${{ env.RELEASE_VERSION }} released" \
            --arg url "$RELEASE_URL" \
            '{channel:$channel,title:$title,description:"Release notes + .aab live.",color:"0x3498DB",author:"Mobile Release Engineer",fields:[{name:"Artifact",value:"app-release.aab",inline:true},{name:"Notes",value:"#changelog + GitHub Releases",inline:true},{name:"Download",value:$url,inline:true}]}')"
          # Discord embeds are best-effort: a transient n8n outage must not fail the
          # release run (it only creates failure-notification spam).
          curl -sS -o /dev/null -w "updates embed: %{http_code}\n" -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H 'Content-Type: application/json' -d "$updates_payload" || true