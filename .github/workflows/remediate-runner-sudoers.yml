name: Remove runner sudoers grant (AUT-4880 F1 remediation)
# One-shot remediation for AUT-4880: the blanket `nathan ALL=(ALL) NOPASSWD: ALL`
# grant was applied to Nathans-iMac-Pro on 2026-10-01 00:08, making every step of
# every workflow on the signing host root-equivalent. Homebrew was never needed —
# provision-runner.sh installs Ruby + fastlane unprivileged under $HOME.
#
# The grant itself is the only available removal path: there is no SSH
# credential for the iMac. It is consumed by a fixed two-command root shell,
# never by repository-controlled input.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remediate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      # rm and visudo run inside ONE sudo invocation so the credential is only
      # needed once — after the drop-in is gone, a second sudo would prompt.
      - name: Remove drop-in and validate sudoers syntax
        run: |
          set -euo pipefail
          echo "== before =="
          ls -l /etc/sudoers.d/github-actions-runner || echo "(absent)"
          sudo -n /bin/sh -c '
            rm -f /etc/sudoers.d/github-actions-runner
            /usr/sbin/visudo -c
          '
          echo "== after =="
          ls -l /etc/sudoers.d/ || true

      # If the grant is truly gone, non-interactive sudo must now fail or drop
      # the NOPASSWD line. Either outcome is the pass condition.
      - name: Confirm the NOPASSWD grant is gone
        run: |
          echo "== sudo -n -l =="
          sudo -n -l 2>&1 || echo "(sudo -n -l exit $? — expected: no passwordless root)"
          echo "== grep NOPASSWD =="
          sudo -n grep -rn 'NOPASSWD' /etc/sudoers /etc/sudoers.d 2>&1 || echo "(no NOPASSWD entries readable)"