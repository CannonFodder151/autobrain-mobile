name: Analyze

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-pr:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      # Stops a future .gitignore edit from re-hiding the tracked ios/Flutter
      # xcconfigs, or from dropping the generated artifacts that became
      # committable when the blanket rule was removed (AUT-4801). Runs against
      # the checked-out tree, no Flutter toolchain needed.
      - name: "Guard self-check: ios/Flutter ignore coverage"
        run: bash scripts/check-ios-flutter-ignore.test.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Fix git safe directory for Flutter cache
        run: git config --global --add safe.directory '*'

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
