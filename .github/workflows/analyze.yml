name: Analyze

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-pr:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      # AUT-4823: self-check for the release CARTO_API_KEY guard. Cheap (no
      # Flutter, no network), and a silently broken guard is worse than none.
      - name: "Guard: CARTO_API_KEY release guard self-check"
        run: bash scripts/check-carto-key.test.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Fix git safe directory for Flutter cache
        run: git config --global --add safe.directory '*'

      - name: Verify Flutter installation
      run: |
        flutter --version
        flutter doctor -v

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
