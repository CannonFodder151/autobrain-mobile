name: Analyze

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-pr:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Check Flutter
        run: |
          echo "=== System Info ==="
          uname -a
          echo "=== Disk Space ==="
          df -h
          echo "=== Checking for Flutter ==="
          if command -v flutter &> /dev/null; then
            echo "Flutter already installed: $(which flutter)"
            flutter --version
          elif [ -d "$HOME/flutter" ]; then
            echo "Flutter found at $HOME/flutter"
            export PATH="$HOME/flutter/bin:$PATH"
            flutter --version
          else
            echo "Flutter not found - checking common locations..."
            ls -la /usr/local/flutter 2>/dev/null || echo "Not at /usr/local/flutter"
            ls -la /opt/flutter 2>/dev/null || echo "Not at /opt/flutter"
            ls -la $HOME/.flutter 2>/dev/null || echo "Not at $HOME/.flutter"
            echo "PATH: $PATH"
            echo "HOME: $HOME"
          fi
          # Add Flutter to PATH for subsequent steps
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Fix git safe directory for Flutter cache
        run: git config --global --add safe.directory '*'

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
