name: Analyze

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-pr:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Check Flutter
        run: |
          echo "=== System Info ==="
          uname -a
          echo "=== Checking for Flutter ==="
          if command -v flutter &> /dev/null; then
            echo "Flutter found in PATH: $(which flutter)"
            flutter --version
            echo "FLUTTER_IN_PATH=true" >> "$GITHUB_ENV"
          elif [ -d "$HOME/flutter" ]; then
            echo "Flutter found at $HOME/flutter"
            export PATH="$HOME/flutter/bin:$PATH"
            flutter --version
            echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
            echo "FLUTTER_IN_HOME=true" >> "$GITHUB_ENV"
          else
            echo "Flutter not found"
            which flutter || echo "flutter not in PATH"
            ls -la $HOME/flutter 2>/dev/null || echo "No flutter dir in HOME"
            echo "PATH: $PATH"
            echo "HOME: $HOME"
          fi
          echo "Check Flutter completed successfully"

      - name: Fix git safe directory for Flutter cache
        run: git config --global --add safe.directory '*'

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
