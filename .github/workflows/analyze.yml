name: Analyze

# Compile-guard for the whole tree. Runs on every PR and on main pushes
# (including the auto syncs from CannonFodder151/autobrain). This is what
# catches a stale mobile-only delta (e.g. lib/core/auth_state.dart) breaking
# the build before a release is ever cut (AUT-522).

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Self-hosted runner (gh-runner-autobrain-mobile): cancel stale runs on
# the same branch instead of queueing behind each other. Prevents the Analyze
# + Mobile Release serialization backlog seen in AUT-858 while only one runner
# exists. Safe: jobs are idempotent re-checks of the same head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-pr:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Clear Flutter pub cache
        run: flutter pub cache repair || true

      - name: Fetch dependencies
        run: flutter pub get --refresh

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos