name: Analyze

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-pr:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          if command -v brew >/dev/null 2>&1; then
            brew install jq
          elif [ -x /opt/homebrew/bin/brew ]; then
            /opt/homebrew/bin/brew install jq
          elif [ -x /usr/local/bin/brew ]; then
            /usr/local/bin/brew install jq
          else
            echo "Homebrew not found, trying to download jq directly"
            curl -L -o /usr/local/bin/jq https://github.com/stedolan/jq/releases/download/jq-1.7.1/jq-macos-amd64
            chmod +x /usr/local/bin/jq
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          flutter-version: "3.22.0"

      - name: Fix git safe directory for Flutter cache
        run: git config --global --add safe.directory '*'

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
