name: Analyze

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-pr:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        run: |
          set -euo pipefail
          # Check if Flutter is already installed
          if command -v flutter &> /dev/null; then
            echo "Flutter already installed: $(which flutter)"
            flutter --version
          elif [ -d "$HOME/flutter" ]; then
            echo "Flutter found at $HOME/flutter"
            export PATH="$HOME/flutter/bin:$PATH"
            flutter --version
          else
            echo "Installing Flutter..."
            # Download pre-built Flutter SDK
            FLUTTER_VERSION="3.24.0"
            FLUTTER_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_${FLUTTER_VERSION}-stable.zip"
            echo "Downloading Flutter $FLUTTER_VERSION from $FLUTTER_URL"
            curl -fsSL -o /tmp/flutter.zip "$FLUTTER_URL"
            unzip -q /tmp/flutter.zip -d "$HOME/"
            rm /tmp/flutter.zip
            export PATH="$HOME/flutter/bin:$PATH"
            flutter --version
          fi
          # Add Flutter to PATH for subsequent steps
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Fix git safe directory for Flutter cache
        run: git config --global --add safe.directory '*'

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
