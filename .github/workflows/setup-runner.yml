name: Setup macOS Runner (one-time)
# One-time setup for the self-hosted macOS runner (Nathans-iMac-Pro).
# Installs Homebrew + modern Ruby + fastlane + WWDR intermediate cert.
# Required before release-ios.yml can run on the self-hosted runner (AUT-4379).
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  setup:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Check sudo availability
        run: |
          set -euo pipefail
          echo "User: $(whoami)"
          echo "Groups: $(groups)"
          sudo -n true 2>&1 && echo "sudo NOPASSWD: YES" || echo "sudo NOPASSWD: NO (will need password)"
          # Check if nathan is admin
          dseditgroup -o checkmember -m nathan admin 2>&1 || echo "Not in admin group"

      - name: Install Homebrew to user directory (if missing)
        run: |
          set -euo pipefail
          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed"
            brew --version
          else
            echo "Installing Homebrew to ~/.brew..."
            export HOMEBREW_PREFIX="$HOME/.brew"
            export HOMEBREW_REPOSITORY="$HOME/.brew/Homebrew"
            export HOMEBREW_CACHE="$HOME/Library/Caches/Homebrew"
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo "Homebrew installed to $HOMEBREW_PREFIX"
          fi
          # Ensure brew is on PATH for this session and future shells
          BREW_BIN="$HOME/.brew/bin"
          echo "export PATH=\"$BREW_BIN:\$PATH\"" >> ~/.zshrc
          echo "export PATH=\"$BREW_BIN:\$PATH\"" >> ~/.bash_profile
          export PATH="$BREW_BIN:$PATH"

      - name: Install modern Ruby via Homebrew
        run: |
          set -euo pipefail
          export PATH="$HOME/.brew/bin:$PATH"
          brew update
          brew install ruby
          echo "=== Ruby versions ==="
          which ruby
          ruby --version
          # Persist Homebrew Ruby on PATH
          for rc in "$HOME/.zshrc" "$HOME/.bash_profile"; do
            touch "$rc"
            grep -q "brew --prefix ruby" "$rc" || echo "export PATH=\"$(brew --prefix ruby)/bin:\$PATH\"" >> "$rc"
            grep -q "GEM_HOME" "$rc" || echo 'export GEM_HOME="$HOME/.gem"' >> "$rc"
            grep -q "GEM_PATH" "$rc" || echo 'export GEM_PATH="$GEM_HOME"' >> "$rc"
          done

      - name: Install fastlane via Homebrew Ruby
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix ruby)/bin:$PATH"
          export GEM_HOME="$HOME/.gem"
          export GEM_PATH="$GEM_HOME"
          mkdir -p "$GEM_HOME"
          ruby --version
          gem install fastlane --no-document
          echo "=== fastlane ==="
          which fastlane
          fastlane --version

      - name: Install Apple WWDR intermediate cert
        run: |
          set -euo pipefail
          echo "Downloading Apple WWDR intermediate cert..."
          curl -fsSL -o /tmp/WWDRIntermediateCert.cer \
            "https://developer.apple.com/certification/Apple_WWDR_Intermediate_Cert.cer"
          echo "Importing WWDR cert into System keychain (requires sudo)..."
          sudo security import /tmp/WWDRIntermediateCert.cer \
            -k /System/Library/Keychains/SystemRootCertificates.keychain \
            -A
          echo "Verifying WWDR cert..."
          security find-certificate -c "Apple Worldwide Developer Relations" \
            /System/Library/Keychains/SystemRootCertificates.keychain

      - name: Verify runner readiness
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix ruby)/bin:$PATH"
          export GEM_HOME="$HOME/.gem"
          export GEM_PATH="$GEM_HOME"
          echo "=== Runner ready ==="
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Ruby: $(ruby --version)"
          echo "fastlane: $(fastlane --version | head -1)"
          echo "WWDR cert: $(security find-certificate -c 'Apple Worldwide Developer Relations' /System/Library/Keychains/SystemRootCertificates.keychain 2>&1 | grep 'Apple Worldwide')"
