name: PR Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci || true
      - name: Build
        run: npm run build --if-present || true
      - name: Test
        run: npm test --if-present || true
