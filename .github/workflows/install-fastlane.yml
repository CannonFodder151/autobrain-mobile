name: Install fastlane on macOS runner

# Installs fastlane into a runner-scoped ~/.gem (system Ruby is SIP-locked).
# Required for iOS build automation (AUT-4378).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-fastlane:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Install fastlane via gem (user GEM_HOME)
        # System Ruby (/Library/Ruby/Gems) is SIP-locked on the iMac, so install
        # into ~/.gem and persist that bin dir on the runner's shell PATH.
        run: |
          set -euo pipefail
          GEM_DIR="$HOME/.gem"
          mkdir -p "$GEM_DIR/bin"
          echo "Ruby: $(ruby --version)"
          echo "Gem: $(gem --version)"
          gem install fastlane --no-document --install-dir "$GEM_DIR"
          "$GEM_DIR/bin/fastlane" --version
          for rc in "$HOME/.zshrc" "$HOME/.bash_profile"; do
            touch "$rc"
            grep -q 'HOME/.gem/bin' "$rc" || echo 'export PATH="$HOME/.gem/bin:$PATH"' >> "$rc"
          done
          echo "fastlane installed at $GEM_DIR/bin/fastlane (persisted on runner PATH)"
      - name: Verify fastlane install
        run: |
          "$HOME/.gem/bin/fastlane" --version
