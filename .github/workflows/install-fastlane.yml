name: Install fastlane on macOS runner

# AUT-4290 / AUT-4840: the runner has no Homebrew (`brew: command not found`,
# runs 36517932757 and 36814006469) and no passwordless sudo, so fastlane is
# installed from a user-space Ruby provisioned by
# scripts/install-fastlane-macos.sh, then verified in a separate step.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-fastlane:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.rubies
          key: ios-runner-ruby-micromamba-3.3
      - name: Install fastlane
        run: ./scripts/install-fastlane-macos.sh
      - name: Verify fastlane install
        run: |
          set -euo pipefail
          export PATH="$HOME/.rubies/ruby/bin:$PATH"
          which fastlane
          fastlane --version