name: Install fastlane on macOS runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-fastlane:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Install fastlane via Homebrew
        run: |
          set -euo pipefail
          brew install fastlane
          fastlane --version
      - name: Verify fastlane install
        run: |
          which fastlane
          fastlane --version
