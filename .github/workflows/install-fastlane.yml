name: Install fastlane on macOS runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-fastlane:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Install fastlane via gem (user-install)
        run: |
          set -euo pipefail
          echo "Ruby: $(ruby --version)"
          echo "Gem: $(gem --version)"
          export GEM_HOME="$HOME/.gem"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install fastlane --no-document --user-install
          fastlane --version
      - name: Verify fastlane install
        run: |
          export GEM_HOME="$HOME/.gem"
          export PATH="$GEM_HOME/bin:$PATH"
          which fastlane
          fastlane --version