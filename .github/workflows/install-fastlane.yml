name: Provision macOS runner toolchain (fastlane)

# AUT-4845: provision Ruby + fastlane on the self-hosted macOS runner.
# Dispatch-only: the runner is a persistent host and this script installs
# software on it, so it must never fire from a push or a pull_request.
#
# Dispatch-only also satisfies scripts/check-workflow-runner-isolation.sh rule 3.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Provision toolchain (rbenv Ruby + fastlane)
        run: bash scripts/macos/provision-runner.sh

      # Separate step on purpose: this is the acceptance check that fastlane
      # resolves in a plain non-interactive Actions step, i.e. only from the
      # committed env file and not from anything left over in the step above.
      - name: Verify fastlane in a fresh non-interactive step
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . scripts/macos/toolchain-env.sh
          echo "ruby: $(ruby --version)"
          # AUT-4857: fastlane --version succeeding does NOT prove psych works —
          # fastlane parses YAML lazily. Assert it, so a future libyaml/headers
          # regression fails here instead of inside a release build.
          ruby -e 'require "psych"; YAML.safe_load("a: 1"); puts "psych: #{Psych::VERSION} ok"'
          command -v fastlane
          fastlane --version
