name: Test iOS Runner
# AUT-4840: this workflow is a runner liveness check, not a fastlane installer.
# It previously hard-failed on `brew install fastlane` — the self-hosted iMac
# has no Homebrew, and the gem fallback cannot work either because the
# CommandLineTools Ruby 2.6 SDK is missing ruby/config.h, so fastlane's native
# extensions will not compile (runs 36814006469, 36825183321,
# install-fastlane.yml 36517932757). Report fastlane presence as a diagnostic
# and let the job pass on runner health; actually provisioning fastlane is
# tracked by AUT-4845.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Check runner
        run: echo "Runner is alive"; uname -a
      - name: Check Xcode
        run: xcodebuild -showsdks 2>&1 || echo "Xcode not installed"
      - name: Report toolchain availability
        # Non-fatal by design: this is a liveness probe. See AUT-4845.
        run: |
          set -uo pipefail
          echo "user: $(whoami)  home: $HOME"
          echo "brew: $(command -v brew || echo 'NOT INSTALLED')"
          echo "ruby: $(ruby --version 2>&1)"
          echo "fastlane: $(command -v fastlane || echo 'NOT INSTALLED')"
