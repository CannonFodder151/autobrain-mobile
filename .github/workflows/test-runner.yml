name: Test iOS Runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Check runner
        run: echo "Runner is alive"; uname -a
      - name: Check Xcode
        run: xcodebuild -showsdks 2>&1 || echo "Xcode not installed"
      - name: Install fastlane via gem
        run: |
          set -euo pipefail
          echo "Ruby: $(ruby --version)"
          echo "Gem: $(gem --version)"
          gem install --user-install fastlane --no-document
          export PATH="$PATH:$(gem env user_gemhome)/bin"
          fastlane --version
