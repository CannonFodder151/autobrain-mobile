name: Test iOS Runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Probe prebuilt ruby
        run: |
          set -uo pipefail
          P="$HOME/.rubies/probe"
          rm -rf "$P"; mkdir -p "$P"
          curl -fsSL --retry 3 -o /tmp/ruby.tar.gz \
            https://github.com/ruby/ruby-builder/releases/download/toolcache/ruby-3.3.9-macos-latest.tar.gz
          echo "curl_exit=$?"
          tar -xzf /tmp/ruby.tar.gz -C "$P" && echo "extract ok"
          ls "$P" | head
          file "$P/bin/ruby" 2>&1
          "$P/bin/ruby" -e 'puts RUBY_PLATFORM; puts RUBY_DESCRIPTION' 2>&1
