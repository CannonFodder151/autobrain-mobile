name: Test iOS Runner
# AUT-4840: the self-hosted macOS runner has no Homebrew, so `brew install`
# dies with `brew: command not found` (run 36814006469). Same fix as
# install-fastlane.yml (AUT-4290): gem --user-install against the system Ruby,
# then put the user gem bin dir on PATH.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Check runner
        run: echo "Runner is alive"; uname -a
      - name: Check Xcode
        run: xcodebuild -showsdks 2>&1 || echo "Xcode not installed"
      - name: Install fastlane via gem (no Homebrew on this runner)
        run: |
          set -euo pipefail
          gem install --user-install fastlane --no-document
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          fastlane --version
