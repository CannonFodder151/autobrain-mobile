name: Test iOS Runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Check runner
        run: echo "Runner is alive"; uname -a
      - name: Check Xcode
        run: xcodebuild -showsdks 2>&1 || echo "Xcode not installed"
      # AUT-4840: this runner (Nathans-iMac-Pro, x86_64) has no Homebrew, so
      # `brew install fastlane` only ever exits 127 (run 36814006469). Homebrew
      # cannot be installed from Actions — it needs an interactive/sudo shell on
      # the box, and there is no SSH path to the iMac from the dev box — so
      # provisioning Ruby is the only route Actions can drive.
      #
      # The system Ruby 2.6 that ships inside MacOSX13.1.sdk is not a fallback:
      # its headers are incomplete (no ruby/config.h), so every gem with a C
      # extension fails to build — verified on run 36820215347, where the gem
      # fallback died in cgi-0.5.2/ext/cgi/escape. ruby/setup-ruby downloads a
      # prebuilt ruby-build toolchain into the runner tool cache: no sudo, no
      # Homebrew, complete headers.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      # No `|| true`: the point of this workflow is to prove the runner can
      # install fastlane, so a failed install must keep failing the job.
      - name: Install fastlane
        run: |
          set -euo pipefail
          ruby --version
          gem install fastlane --no-document
          command -v fastlane
          fastlane --version