name: Diagnose iOS signing chain on macOS runner

# workflow_dispatch only, no pull_request (AUT-4722): with a pull_request
# trigger GitHub executes the workflow file *from the PR head*, so any
# contributor could land arbitrary shell on the persistent macOS runner.
#
# workflow_dispatch is the right trigger here because it requires write access
# to dispatch and to pick the ref (Actions tab -> Run workflow -> "Use workflow
# from"). Note that the ref selector loads the workflow file *from that ref*,
# so it is the write-permission gate, not branch selection, that keeps this
# off contributor-controlled code. Read-only introspection stays available via
# dispatch; do not re-add a pull_request trigger to get it back.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Report toolchain
        # Non-fatal by design (AUT-4864): this step only reports host state.
        # GitHub's default shell is `bash -e {0}`, so the `-e` dropped by
        # `set -uo pipefail` is re-added by the runner and the step aborts on
        # the first probe that returns non-zero, turning a diagnostic into a
        # red X that hides the sections below it.
        continue-on-error: true
        # `shell: bash` alone would still be `bash -e {0}`; the explicit
        # invocation is what actually honours the `set -uo pipefail` below.
        shell: bash {0}
        run: |
          set -uo pipefail
          echo "runner: $(hostname)  user: $(whoami)  home: $HOME"
          echo "xcode-select: $(xcode-select -p 2>&1)"
          xcodebuild -version 2>&1 || true
          xcodebuild -showsdks 2>&1 | head -20 || true
          echo "ruby: $(ruby --version 2>&1)"

      - name: Report Apple intermediate (WWDR) certificates in system keychain
        # The self-hosted iMac is a plain macOS install, not an Xcode-provisioned
        # CI image. If the Apple WWDR / Apple Root intermediates are missing,
        # `security find-identity -v -p codesigning` shows the imported
        # distribution identity as "(CSSMERR_TP_NOT_TRUSTED)" and the archive step
        # fails with "code object is not signed at all" / chain validation errors.
        # Non-fatal by design (AUT-4864) — reports state, does not gate.
        continue-on-error: true
        # `shell: bash` alone would still be `bash -e {0}`; the explicit
        # invocation is what actually honours the `set -uo pipefail` below.
        shell: bash {0}
        run: |
          set -uo pipefail
          echo "=== security find-certificate -a -c 'Apple' (system keychain) ==="
          security find-certificate -a -c "Apple" /Library/Keychains/System.keychain 2>/dev/null \
            | grep -E 'alis|labl' | sort -u || echo "NONE FOUND"
          echo "=== identities (codesigning) ==="
          security find-identity -v -p codesigning 2>&1 || true

      - name: Report writable gem paths
        # Non-fatal by design (AUT-4864) — `gem env home` alone aborts the step
        # under the default `bash -e {0}` shell when gem is unusable, hiding the
        # writability verdict that is the entire point of this step.
        continue-on-error: true
        # `shell: bash` alone would still be `bash -e {0}`; the explicit
        # invocation is what actually honours the `set -uo pipefail` below.
        shell: bash {0}
        run: |
          set -uo pipefail
          echo "GEM_HOME=${GEM_HOME:-<unset>}"
          gem env home 2>&1
          [[ -w "$(gem env home)" ]] && echo "gem home WRITABLE" || echo "gem home NOT writable"
          echo "user-install dir: $(gem env user_gemhome 2>&1)"
