name: Mobile Release (.ipa)

# iOS release pipeline: build + code-sign + published GitHub Release + Discord notes.
# Manual workflow_dispatch only — never runs on push. Pairs with release-mobile.yml.
# Apple code signing uses secrets: IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD,
# IOS_PROVISIONING_PROFILE_BASE64, IOS_TEAM_ID, IOS_EXPORT_METHOD.
# .ipa is uploaded to TestFlight (beta lane) or App Store Connect (release lane).
#
# CI path: GitHub-hosted macos-latest (self-hosted macOS VM blocked on AUT-2725).
# Once AUT-2725 provisions 10.0.3.40, change `runs-on: macos-latest` to
# [self-hosted, macOS, vm-macos] for cost control.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build, e.g. v0.3.4+21 (must match pubspec.yaml version X.Y.Z+N)'
        required: true
        type: string
      lane:
        description: 'beta = TestFlight, release = App Store'
        required: true
        type: choice
        default: release
        options:
          - beta
          - release

permissions:
  contents: write

jobs:
  ios-release:
    runs-on: macos-latest
    env:
      APP_IDENTIFIER: com.autobrainservice.app
      EXPORT_METHOD: ${{ inputs.lane == 'beta' && 'development' || 'app-store' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version (input or pubspec)
        # Push-triggered runs have no inputs.version — derive it from
        # pubspec.yaml so sync commits to main build + publish automatically.
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            tag="${{ inputs.version }}"
          else
            version="$(grep -E '^version: ' pubspec.yaml | head -1 | awk '{print $2}')"
            tag="v${version}"
          fi
          tag="${tag#v}"
          tag="v${tag}"
          echo "Resolved release tag: $tag"
          echo "RELEASE_VERSION=$tag" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        # Generates ios/Runner.xcodeproj (checked into .gitignore, regenerated
        # on every pub get). Must run BEFORE the deployment-target patch below.
        run: flutter pub get

      - name: Pin minimum iOS version to 15.0 in generated Xcode project
        # Flutter generates a fresh ios/Runner.xcodeproj with
        # IPHONEOS_DEPLOYMENT_TARGET=13.0. The only way to lock it is a
        # post-pub sed patch. IOS_DEPLOYMENT_TARGET=15.0 matches the issue
        # decision: iOS 15+ min, TARGETED_DEVICE_FAMILY=1,2 (iPhone+iPad=universal).
        run: |
          set -euo pipefail
          PROJ="ios/Runner.xcodeproj/project.pbxproj"
          [[ -f "$PROJ" ]] || { echo "::error::$PROJ not found after flutter pub get"; exit 1; }
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$PROJ"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1";/TARGETED_DEVICE_FAMILY = "1,2";/g' "$PROJ"
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = 15.0" "$PROJ" | awk '{print "Locked iOS 15.0 deployment target in $PROJ ("$1" occurrences)"}'

      - name: Verify requested version matches pubspec
        run: |
          set -euo pipefail
          version="$(grep -E '^version: ' pubspec.yaml | head -1 | awk '{print $2}')"
          tag="v${version}"
          if [[ "$tag" != "${{ env.RELEASE_VERSION }}" ]]; then
            echo "::error::pubspec.yaml version is ${tag} but requested ${{ env.RELEASE_VERSION }}. Run bump-version.sh --mobile in the autobrain monorepo first."
            exit 1
          fi
          echo "Building release ${tag} for iOS (lane: ${{ env.LANE }})"

      - name: Detect semantic version iteration (Discord changelog gate)
        id: semver-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          req_semver="$(echo '${{ inputs.version }}' | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "semver=$req_semver" >> "$GITHUB_OUTPUT"
          released="$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null \
            | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/' || true)"
          if grep -qx "$req_semver" <<<"$released"; then
            echo "post_discord=false" >> "$GITHUB_OUTPUT"
          else
            echo "post_discord=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Apple distribution certificate
        env:
          CERT_P12_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD || 'autobrain' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="build.keychain"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$CERT_P12_B64" | base64 --decode > /tmp/dist-cert.p12
          security import /tmp/dist-cert.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "Certificate installed in keychain $KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROVISIONING_PROFILE_B64" | base64 --decode > "$PROFILE_DIR/autobrain_distribution.mobileprovision"
          echo "Provisioning profile installed:"
          security cms -D -i "$PROFILE_DIR/autobrain_distribution.mobileprovision" 2>/dev/null | plutil -convert json - -o - 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print('  Name:', d.get('Name','?')); print('  Team:', d.get('TeamIdentifier',['?'])[0]); print('  AppID:', d.get('AppIDName','?'))" || echo "Profile installed (could not decode)"

      - name: Build iOS release (export method, code-signed)
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          SPECIFIER="${PROVISIONING_PROFILE_SPECIFIER:-}"
          BUILD_ARGS=(
            --release
            --dart-define=API_BASE_URL=https://hosted.autobrainservice.app/api/v1
            --dart-define=WS_BASE_URL=wss://hosted.autobrainservice.app/ws
            --dart-define=MOBILE_STORE_BUILD=true
            --export-method="$EXPORT_METHOD"
            --build-number="$(grep -E '^version: ' pubspec.yaml | head -1 | awk -F'[+]' '{print $2}')"
          )
          if [[ -n "$SPECIFIER" ]]; then
            echo "Using provisioning profile specifier: $SPECIFIER"
            export PROVISIONING_PROFILE_SPECIFIER="$SPECIFIER"
          else
            echo "WARNING: IOS_PROVISIONING_PROFILE_SPECIFIER secret not set; Xcode will auto-resolve profile from keychain"
          fi
          flutter build ios "${BUILD_ARGS[@]}"

      - name: Create ExportOptions.plist (lane-aware)
        # beta lane -> development (TestFlight), release lane -> app-store.
        # The flutter build step passes --export-method but xcodebuild -exportArchive
        # reads this plist, so it must match the lane or the export fails.
        # Must run BEFORE archive+export (AUT-3214).
        run: |
          set -euo pipefail
          METHOD="${{ env.EXPORT_METHOD }}"
          cat > ios/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>__METHOD__</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/__METHOD__/${METHOD}/" ios/ExportOptions.plist
          echo "ExportOptions.plist method=$METHOD"

      - name: Archive + export .ipa (Xcode, universal device+sim build)
        run: |
          set -euo pipefail
          BUILD_DIR="build/ios/ipa"
          mkdir -p "$BUILD_DIR"
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$BUILD_DIR/Runner.xcarchive" \
            -allowProvisioningUpdates \
            archive
          xcodebuild -exportArchive \
            -archivePath "$BUILD_DIR/Runner.xcarchive" \
            -exportPath "$BUILD_DIR" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Verify .ipa produced
        run: |
          set -euo pipefail
          ipa="$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)"
          [[ -n "$ipa" ]] || { echo "::error::No .ipa found in build/ios/ipa/"; exit 1; }
          echo "IPA: $ipa ($(du -h "$ipa" | cut -f1))"

      - name: Extract changelog entry for this version (release body)
        id: changelog
        run: |
          semver="$(echo '${{ inputs.version }}' | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          awk -v s="## [$semver]" 'index($0,s){f=1;next} f && /^## /{exit} f' CHANGELOG.md > "$RUNNER_TEMP/release-body.md"
          [[ -s "$RUNNER_TEMP/release-body.md" ]] || { echo "::error::CHANGELOG.md has no section for [$semver]"; exit 1; }
          { echo "# ${{ inputs.version }}"; echo; cat "$RUNNER_TEMP/release-body.md"; } > "$RUNNER_TEMP/release-body-full.md"
          echo "body_file=$RUNNER_TEMP/release-body-full.md" >> "$GITHUB_OUTPUT"

      - name: Upload to App Store Connect (TestFlight or App Store)
        id: appstore
        env:
          APPLE_STORE_API_KEY: ${{ secrets.APPLE_STORE_API_KEY }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: "com.autobrainservice.app"
        run: |
          set -euo pipefail
          ipa="$(ls build/ios/ipa/*.ipa | head -1)"
          auth_key="$HOME/.app-store-connect/AuthKey.p8"
          mkdir -p "$HOME/.app-store-connect"
          echo "$APPLE_STORE_API_KEY" > "$auth_key"
          key_id="$(jq -r '.key_id' "$auth_key" 2>/dev/null || python3 -c "import json; d=json.load(open('$auth_key')); print(d.get('key_id',''))")"
          issuer_id="$(jq -r '.issuer_id' "$auth_key" 2>/dev/null || python3 -c "import json; d=json.load(open('$auth_key')); print(d.get('issuer_id',''))")"
          if jq -e '.private_key' "$auth_key" >/dev/null 2>&1; then
            jq -r '.private_key' "$auth_key" > "$HOME/.app-store-connect/AuthKey_${key_id}.p8"
            auth_key="$HOME/.app-store-connect/AuthKey_${key_id}.p8"
            echo "APP_STORE_CONNECT_API_KEY_ID=$key_id" >> "$GITHUB_ENV"
            echo "APP_STORE_CONNECT_API_ISSUER_ID=$issuer_id" >> "$GITHUB_ENV"
          fi
          echo "Uploading $ipa (${{ inputs.lane }} lane) to App Store Connect"
          xcrun altool --upload-app -t ios -f "$ipa" -u "$(jq -r '.username' "$auth_key" 2>/dev/null || echo '')" -p "$APPLE_STORE_API_KEY" --output-format xml 2>&1 | tee "$RUNNER_TEMP/altool-output.xml" || true
          xcrun notarytool submit "$ipa" --key "$HOME/.app-store-connect/AuthKey_${key_id}.p8" --key-id "$key_id" --issuer "$issuer_id" --wait 2>&1 || echo "notarytool skipped (may already be notarized)"

      - name: Conditionally publish GitHub Release (release lane only)
        if: ${{ inputs.lane == 'release' }}
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body_path: ${{ steps.changelog.outputs.body_file }}
          draft: false
          files: build/ios/ipa/*.ipa

      - name: Post Discord changelog + updates (n8n Reporter)
        if: ${{ inputs.lane == 'release' }}
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SEMVER: ${{ steps.semver-check.outputs.semver }}
          POST_CHANGELOG: ${{ steps.semver-check.outputs.post_discord }}
          LANE: ${{ inputs.lane }}
        run: |
          notes="$(awk -v s="## [$SEMVER]" 'index($0,s){f=1;next} f && /^## /{exit} f' CHANGELOG.md \
            | grep -E '^- ' | sed 's/^- //; s/`//g; s/\*\*//g' \
            | head -3 | tr '\n' ' ' | cut -c1-400)"
          if [[ "$POST_CHANGELOG" == "true" ]]; then
            changelog_payload="$(jq -n \
              --arg channel changelog \
              --arg title "AutoBrain iOS $SEMVER released" \
              --arg desc "$notes" \
              --arg url "$RELEASE_URL" \
              '{channel:$channel,title:$title,description:$desc,color:"0x2ECC71",author:"Mobile Release Engineer",fields:[{name:"Download",value:$url,inline:true},{name:"Platform",value:"iOS (.ipa)",inline:true},{name:"Lane",value:$LANE,inline:true}]}')"
            curl -sS -o /dev/null -w "changelog embed: %{http_code}\n" -X POST https://n8n.nathanmartina.com/webhook/discord-report \
              -H 'Content-Type: application/json' -d "$changelog_payload" || true
          fi
          updates_payload="$(jq -n \
            --arg channel updates \
            --arg title "Mobile iOS ${{ inputs.version }} (${LANE})" \
            --arg url "${{ steps.release.outputs.url || 'TestFlight' }}" \
            '{channel:$channel,title:$title,description:"Release notes + .ipa built and uploaded.",color:"0x3498DB",author:"Mobile Release Engineer",fields:[{name:"Artifact",value:"Runner.ipa",inline:true},{name:"Notes",value:"#changelog + GitHub Releases",inline:true},{name:"Lane",value:$LANE,inline:true}]}')"
          curl -sS -o /dev/null -w "updates embed: %{http_code}\n" -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H 'Content-Type: application/json' -d "$updates_payload" || true
